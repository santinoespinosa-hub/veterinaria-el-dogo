<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - El Dogo</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <header>
        <h1>El Dogo</h1>
    </header>

    <nav class="menu">
        <div class="contenedor">
            <ul class="menu-flex">
                <li><a href="./">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./clientes.html">Clientes</a></li>
                <li><a href="./mascotas.html">Mascotas</a></li>
            </ul>
        </div>
    </nav>

    <main class="contenedor sombra">
        <div class="titulo-admin-flex">
            <h2>Gestión de Clientes</h2>
            <button id="btn-nuevo-cliente" class="boton-admin">Cargar nuevo cliente</button>
        </div>

        <!-- Tabla de Clientes -->
        <section class="carrito">
            <table border="1" style="width: 100%; text-align: left; margin-top: 20px;">
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Nombre y Apellido</th>
                        <th>Dirección</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-clientes">
                    <!-- Se carga dinámicamente -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Diálogo Modal para Cargar/Editar Cliente -->
    <dialog id="dialogo-cliente">
        <form id="form-cliente" class="formulario-modal">
            <input type="hidden" id="cli-index" value="-1">
            <h3 id="dialogo-titulo">Cargar Cliente</h3>

            <div class="campo-modal">
                <label for="cli-dni">DNI:</label>
                <input type="number" id="cli-dni" required>
            </div>
            <div class="campo-modal">
                <label for="cli-nombre">Nombre y Apellido:</label>
                <input type="text" id="cli-nombre" required>
            </div>
            <div class="campo-modal">
                <label for="cli-direccion">Dirección:</label>
                <input type="text" id="cli-direccion" required>
            </div>
            <div class="campo-modal">
                <label for="cli-telefono">Nº de Teléfono:</label>
                <input type="tel" id="cli-telefono" required>
            </div>

            <div class="form-botones">
                <button type="submit" class="boton-dialogo guardar">Guardar</button>
                <button type="button" id="btn-cancelar-cliente" class="boton-dialogo cancelar">Cancelar</button>
            </div>
        </form>
    </dialog>

    <footer>
        <p>El Dogo - Todos los derechos reservados - 2026</p>
    </footer>

    <script src="./controladores/lista-clientes.js"></script>
</body>
</html>
